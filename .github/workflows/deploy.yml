# Builds and deploys the website to Cloudflare Workers.
#   Pull request -> checks + a preview deployment (link posted on the PR)
#   Push to main -> checks + the live site
name: Deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: e71f8c6c97522b3b8852172389fbac12
  SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
  SANITY_DATASET: production
  SITE_URL: https://nauyana.id

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter web build

      - name: Deploy the live site
        if: github.event_name == 'push'
        working-directory: web
        run: pnpm exec wrangler deploy

      - name: Deploy a preview
        if: github.event_name == 'pull_request'
        working-directory: web
        run: |
          pnpm exec wrangler preview --name "pr-${{ github.event.pull_request.number }}" 2>&1 | tee preview.log
          exit "${PIPESTATUS[0]}"

      - name: Post the preview link
        if: github.event_name == 'pull_request'
        working-directory: web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' preview.log | head -n 1)
          [ -n "$url" ] || exit 0
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" \
            --body "Preview: $url" --edit-last --create-if-none
